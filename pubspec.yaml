name: shiroikumanojisho
description: A full-featured immersion language learning suite for mobile.
publish_to: 'none'
version: 1.5.0+2
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: "^3.44.0"

dependencies:
  async_zip:
    # Vendored: 0.1.0 is the only release and its embedded AGP-4
    # buildscript cannot load under Gradle 9 — see vendor/async_zip.
    path: vendor/async_zip
  audio_service: ^0.18.9
  audio_session: ^0.2.4
  beautiful_soup_dart: ^0.3.0
  blurrycontainer:
    git:
      url: https://github.com/arianneorpilla/blurry_container/
      ref: fb26dd1fa81edeb048b14703f1c1f28e93ee43d0
  cached_network_image: ^3.2.3
  cached_network_svg_image: ^2.0.0
  cancelable_compute: ^2.1.1
  carousel_slider: ^5.1.2
  change_notifier_builder: ^1.1.2
  chat_gpt_sdk: ^3.1.6
  clipboard: ^3.0.14
  collection:
  copy_with_extension: ^15.0.1
  crop_image: ^1.0.4
  dart_mappable: ^4.0.0-dev.1
  device_info_plus: ^13.2.0
  dio: ^5.1.1
  document_file_save_plus:
    # Vendored: jcenter() + embedded AGP-7 buildscript break Gradle 9;
    # namespace added. See vendor/document_file_save_plus.
    path: vendor/document_file_save_plus
  expandable: ^5.0.1
  external_app_launcher: ^4.0.3
  external_path: ^2.2.0
  favicon: ^1.1.1
  # 12 beta line: the only release stream compatible with win32 6
  # (which wakelock_plus/package_info_plus 10 force). Static
  # pickFiles/clearTemporaryFiles API identical to 11.
  file_picker: ^12.0.0-beta.7
  filesystem_picker:
    # Vendored jidoujisho fork (multi-root, usedFiles highlighting,
    # marquee) — upstream 4.1.0 lacks these; see migration/fork-diff-small-three.md.
    path: vendor/filesystem_picker
  float_column: ^4.1.0
  flutter:
    sdk: flutter
  flutter_archive: ^6.3.1
  flutter_cache_manager: ^3.3.0
  flutter_charset_detector: ^6.0.0
  flutter_colorpicker: ^1.0.3
  flutter_exit_app: ^2.1.2
  # Replaces retired flutter_ffmpeg. This package IS the Full-GPL
  # variant (the maintained mainline; the LGPL "_full" sibling is two
  # majors stale) — matches the full-gpl-lts native package we always
  # shipped. See migration/ffmpeg-audit.md for the call-site inventory.
  ffmpeg_kit_flutter_new: ^4.5.3
  flutter_gpt_tokenizer: ^0.1.0
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  flutter_image_compress: ^2.5.0
  # Hosted upstream replaces the fork (= 6.0.0-beta.25 + furigana
  # filter); the <rt>/<rp> selection filter now lives app-side — see
  # migration/fork-diff-inappwebview.md.
  flutter_inappwebview: ^6.1.5
  flutter_launcher_icons: ^0.14.4
  flutter_logs: ^2.1.11 
  flutter_native_splash: ^2.2.8
  flutter_riverpod: ^2.3.6
  flutter_staggered_grid_view: ^0.7.0
  # Hosted upstream replaces the fork; the fork's OpenSLES hook is the
  # only live patch — retest audio-cut on device, re-vendor only if it
  # recurs. See migration/fork-diff-vlc-nowplaying.md.
  flutter_vlc_player: ^7.4.4
  fluttertoast: ^9.1.0
  google_fonts: ^8.2.0
  # Un-vendored: the new toolchain satisfies the hosted constraints
  # (Dart >=3.8, AGP 8+, compileSdk 35+).
  google_mlkit_text_recognition: ^0.16.0
  hive: ^2.0.6
  hive_flutter: ^1.1.0
  html: ^0.15.2
  http: ^1.0.0
  image_picker: ^1.2.3
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.3
  # Maintained continuation of isar 3.x — same on-disk format since
  # 3.1.0+1 (verified against a device DB copy in Phase 5 before any
  # release).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  json_annotation: ^4.12.0
  json_serializable: ^6.6.1
  just_audio: ^0.10.6
  kana_kit: ^2.0.0
  lemmatizerx: ^1.0.0
  list_counter: ^1.0.2
  local_assets_server: ^2.0.2+12
  marquee: ^2.2.3
  material_floating_search_bar_2:
    # Community continuation of the deleted bnxm upstream (contains all
    # three fork patches); vendored for the AppBarTheme ->
    # AppBarThemeData type rename in Flutter 3.4x.
    path: vendor/material_floating_search_bar_2
  mecab_dart:
    # Vendored: jcenter() + embedded AGP-3.5 buildscript break Gradle 9;
    # namespace added. See vendor/mecab_dart.
    path: vendor/mecab_dart
  multi_value_listenable_builder: ^0.0.2
  network_to_file_image: ^7.0.0
  nowplaying:
    # Vendored fork (unupstreamed NPE crash fix; namespace added) —
    # upstream dormant since 2024. See migration/fork-diff-vlc-nowplaying.md.
    path: vendor/nowplaying
  package_info_plus: ^10.2.1
  path: ^1.8.2
  path_provider: ^2.0.13
  permission_handler: ^12.0.3
  progress_indicators: ^1.0.0
  quiver: ^3.2.1
  recase: ^4.1.0
  receive_intent:
    # Vendored: upstream master (AGP 9-ready) + the fork's
    # setResult(action:) patch cherry-picked on top (mpv/Jellyfin
    # playback-position contract). See migration/fork-diff-small-three.md.
    path: vendor/receive_intent
  remove_emoji: ^0.0.7
  reorderables: ^0.6.0
  restart_app: ^1.1.2
  ruby_text:
    # Vendored fork: MediaQuery.boldTextOverride was removed in current
    # Flutter; one-line fix to MediaQuery.boldTextOf.
    path: vendor/ruby_text
  screen_brightness: ^2.1.11
  scrollable_positioned_list: ^0.3.5
  share_plus: ^13.3.0
  slang: ^3.13.0
  slang_flutter: ^3.13.0
  sliver_tools: ^0.2.12
  spaces:
    git:
      url: https://github.com/arianneorpilla/spaces
      ref: master
  stack_trace: ^1.11.1
  subtitle:
    git:
      url: https://github.com/arianneorpilla/subtitle
      ref: 36562dcda59c67c170f6e0a10ad5f775eb3341e3
  transparent_image: ^2.0.1
  uri_to_file: ^1.0.0
  url_launcher: ^6.0.20
  ve_dart:
    git:
      url: https://github.com/arianneorpilla/ve_dart
      ref: c366bb1ae24f6fad4f5c7e3a1efad5f2b8122e58
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.7.0
  web_socket_channel: ^2.3.0
  youtube_explode_dart: ^3.1.0
  
dependency_overrides:
  mecab_dart: # ve_dart requires hosted mecab_dart; force the vendored copy
    path: vendor/mecab_dart
  flutter_inappwebview_android: # hosted 1.1.3 + AGP 9 proguard fix + furigana-filter getSelectedText (the jidoujisho fork's patch)
    path: vendor/flutter_inappwebview_android
  flutter_vlc_player_platform_interface:
    # Upstream release bug: flutter_vlc_player 7.4.4's Java pigeon uses
    # new-style channel names but the PUBLISHED interface 2.0.5 still
    # has old-style ones -- every VLC call dies with channel-error. The
    # regenerated Dart side exists only in the monorepo; vendored from
    # the 7.4.4 tag (988a7e67).
    path: vendor/flutter_vlc_player_platform_interface
  ffi: ^2.2.0 # Caused by mecab_dart 0.1.3 (via ve_dart) pinning ffi ^1
  mime: ^2.0.0 # Caused by local_assets_server 2.0.2+12 (latest) pinning mime ^1; share_plus 13 needs ^2
  path: ^1.9.1 # Caused by the subtitle fork pinning path <1.9
  freezed_annotation: ^2.2.0 # Caused by spaces
  gap: ^3.0.1 # Caused by spaces
  record_mp3_plus: ^1.2.0 # Retest then drop (toolchain migration)

dev_dependencies:
  build_runner: ^2.3.3
  dart_mappable_builder: ^4.0.0-dev.2
  dependency_validator: ^5.0.5
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  
flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/meta/icon.png"
  adaptive_icon_background: "#000000" 
  adaptive_icon_foreground: "assets/meta/icon-android12.png"

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/
    - assets/meta/
    - assets/mokuro-template/
    - assets/mokuro-template/icons/
    - assets/language/japanese/ipadic/
    - assets/ttu-ebook-reader/
    - assets/ttu-ebook-reader/_app/
    - assets/ttu-ebook-reader/_app/immutable/
    - assets/ttu-ebook-reader/_app/immutable/assets/
    - assets/ttu-ebook-reader/_app/immutable/chunks/
    - assets/ttu-ebook-reader/_app/immutable/components/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/auth/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/b/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/manage/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/settings/
    - assets/ttu-ebook-reader/auth/
    - assets/ttu-ebook-reader/b/
    - assets/ttu-ebook-reader/fonts/
    - assets/ttu-ebook-reader/icons/
    - assets/ttu-ebook-reader/manage/
    - assets/ttu-ebook-reader/settings/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
        - asset: assets/fonts/NotoSansJP-Bold.otf
          weight: 700
