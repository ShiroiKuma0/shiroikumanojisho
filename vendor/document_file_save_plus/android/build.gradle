// Vendored for shiroikumanojisho (toolchain migration): upstream
// build.gradle used jcenter() (removed in Gradle 9) and an embedded
// AGP-7/Kotlin buildscript — plugin projects inherit AGP and KGP from
// the main build via the Flutter plugin loader. namespace added
// (AGP 8+ requirement); lintOptions dropped.
group 'com.advoques.document_file_save_plus'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Match Java and Kotlin JVM targets (KGP 2.3 defaults to the
    // toolchain JDK, javac to 11 -- Gradle rejects the mismatch).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'com.advoques.document_file_save_plus'
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
    }
}
