// Vendored for shiroikumanojisho (toolchain migration): upstream
// build.gradle used jcenter() (removed in Gradle 9) and an embedded
// AGP-7/Kotlin buildscript — plugin projects inherit AGP and KGP from
// the main build via the Flutter plugin loader. namespace added
// (AGP 8+ requirement); lintOptions dropped.
group 'com.advoques.document_file_save_plus'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.advoques.document_file_save_plus'
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
    }
}
