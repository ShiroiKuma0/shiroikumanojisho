// Vendored for shiroikumanojisho (toolchain migration): upstream
// build.gradle used jcenter() (removed in Gradle 9) and an embedded
// AGP-3.5/Kotlin-1.3 buildscript — plugin projects inherit AGP and
// KGP from the main build via the Flutter plugin loader. namespace
// added (AGP 8+ requirement); lintOptions dropped; CMake native build
// (libmecab FFI) kept as-is.
group 'com.example.mecab_dart'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Match Java and Kotlin JVM targets (KGP 2.3 defaults to the
    // toolchain JDK, javac to 11 -- Gradle rejects the mismatch).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'com.example.mecab_dart'
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    externalNativeBuild {
        cmake {
           path "CMakeLists.txt"
        }
    }
}
