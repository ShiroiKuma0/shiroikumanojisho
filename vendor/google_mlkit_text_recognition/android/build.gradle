// Vendored from google_mlkit_text_recognition 0.16.0 (flutter-ml/google_ml_kit_flutter).
// Adjusted for this project's toolchain: AGP 7.1.2 / Gradle 7.2 / Kotlin 1.8.22 /
// compileSdk 34, and `namespace` replaced by the manifest package attribute,
// which pre-7.3 AGP requires. The per-script recognizer artifacts stay
// compileOnly here — the app's own build.gradle declares the Japanese model.
group = "com.google_mlkit_text_recognition"
version = "1.0"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.1.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation("com.google.mlkit:text-recognition:16.0.1")
    compileOnly("com.google.mlkit:text-recognition-chinese:16.0.1")
    compileOnly("com.google.mlkit:text-recognition-devanagari:16.0.1")
    compileOnly("com.google.mlkit:text-recognition-japanese:16.0.1")
    compileOnly("com.google.mlkit:text-recognition-korean:16.0.1")
}
