plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Compute an Android `versionCode` that is strictly monotonic across
// all builds — releases and dev iterations alike. Flutter's default
// uses just pubspec's `+N` as the code, which regresses at every
// release (`1.0.0+25` has code 25; the subsequent `1.0.1` release
// has code 1 — installer rejects as a downgrade).
//
// Pack `X.Y.Z+N` into a single integer with per-component slots:
//   code = X * 100_000_000 + Y * 1_000_000 + Z * 10_000 + min(N, 99)
// Headroom: X ≤ 21 (int32 ceiling), 99 minors, 99 patches, 99 dev
// iterations. The 1_000s digit is deliberately left at zero: under
// `--split-per-abi` Flutter's Gradle plugin unconditionally adds
// `abi * 1000` (armeabi-v7a 1, arm64-v8a 2, x86-64 4) through the
// legacy versionCodeOverride, whose first write FINALIZES the
// property — it cannot be overridden from the app build (verified
// 2026-07-25 on Flutter 3.44.8 / AGP 9; both the new-API
// output.versionCode.set and a later afterEvaluate write lose). So
// the scheme reserves that digit as Flutter's ABI slot instead of
// fighting it: an arm64 build of 1.4.0+26 reads 1_04_00_2_026.
//
// IMPORTANT: the `N` value is read DIRECTLY from pubspec.yaml here,
// not from `flutter.versionCode`, because Flutter smooshes bare
// `X.Y.Z` pubspec versions into `versionCode=1` — identical to
// `X.Y.Z+1`. We need to tell release (bare, N=0) from first-dev
// (+1, N=1). Reading pubspec.yaml directly preserves the
// distinction: bare → N=0, `+K` → N=K.
//
// Examples (base code; the shipped arm64 APK carries base + 2_000):
//   1.0.0+25   → 100_000_025    (dev iteration)
//   1.0.1      → 100_010_000    (release — cleanly > 1.0.0+99)
//   1.0.1+1    → 100_010_001    (first dev after release, cleanly >)
//   1.4.0+26   → 104_000_026
//   2.0.0      → 200_000_000
//
// One-time migrations: pre-2026-06 builds used `100 * N +
// abi_offset` (max ~2500); the 2026-06 scheme used X*1e6 + Y*1e4 +
// Z*100 + N (max shipped: 1_040_025). This scheme starts at
// 100_000_000+, comfortably greater than both.
def pubspecFile = file("${rootProject.projectDir}/../pubspec.yaml")
def pubspecVersionLine = pubspecFile.readLines().find { it =~ /^version:\s/ }
if (pubspecVersionLine == null) {
    throw new GradleException("could not find 'version:' line in pubspec.yaml")
}
def pubspecVersionMatcher = (pubspecVersionLine =~ /^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?\s*$/)
if (!pubspecVersionMatcher.matches()) {
    throw new GradleException(
        "pubspec version must be X.Y.Z or X.Y.Z+N, got: '${pubspecVersionLine}'")
}
def pubspecMajor = pubspecVersionMatcher[0][1].toInteger()
def pubspecMinor = pubspecVersionMatcher[0][2].toInteger()
def pubspecPatch = pubspecVersionMatcher[0][3].toInteger()
// The `+N` group is optional. Bare `X.Y.Z` (release form) → null → 0.
// `X.Y.Z+K` (dev form) → K.
def pubspecBuildN = pubspecVersionMatcher[0][4] != null
    ? pubspecVersionMatcher[0][4].toInteger()
    : 0
// The Android `versionName` is the full pubspec version verbatim —
// `X.Y.Z+N` for dev builds, bare `X.Y.Z` for releases. Flutter's
// own `flutter.versionName` property cannot be used for this: it
// strips everything after the `+` into versionCode, so installers
// and the in-app version display would show two dev builds as the
// same version. Built from the raw (unclamped) `+N` group.
def pubspecVersionName = pubspecVersionMatcher[0][4] != null
    ? "${pubspecMajor}.${pubspecMinor}.${pubspecPatch}+${pubspecVersionMatcher[0][4]}"
    : "${pubspecMajor}.${pubspecMinor}.${pubspecPatch}"
// Clamp dev-iteration count to 99. More than 99 dev builds between
// two releases would indicate something weird; capping prevents
// the dev slot from spilling into the next patch's slot.
if (pubspecBuildN > 99) pubspecBuildN = 99
def computedVersionCode =
    pubspecMajor * 100000000 +
    pubspecMinor * 1000000 +
    pubspecPatch * 10000 +
    pubspecBuildN

// Release signing. The keystore and its passwords live OUTSIDE the
// repo — `keystore.properties` at the repo root is gitignored, and the
// canonical copies are in ~/.android-keystores/ and the 暗号 vault.
//
// Until 1.5.0+024 this app's release buildType carried
// `signingConfig signingConfigs.debug`, so every "release" APK ever
// shipped — tagged releases included — was signed with the universal
// Android debug key. That is why the missing-keystore path below
// FAILS the build instead of falling back to debug: a silent fallback
// is exactly how it went unnoticed for so long.
def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "shiroikuma.jisho"
    compileSdk flutter.compileSdkVersion

    buildFeatures {
        // AGP 8+ stops generating BuildConfig by default;
        // MainActivity uses BuildConfig.APPLICATION_ID for the
        // FileProvider authority.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "shiroikuma.jisho"
        minSdkVersion 24
        // targetSdk deliberately held at 32 through the toolchain
        // migration — raising it is its own follow-up project (see
        // TOOLCHAIN_MIGRATION_PLAN.md, decision 2).
        targetSdkVersion 32
        versionCode computedVersionCode
        versionName pubspecVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            if (!hasKeystore) {
                throw new GradleException(
                    "keystore.properties is missing — a release build would " +
                    "silently fall back to the Android debug key. Restore it " +
                    "from the 暗号 vault (android-keystores.org) before building.")
            }
            signingConfig signingConfigs.release
            proguardFiles 'proguard-rules.pro'
        }

        debug {
        }
    }

    packagingOptions {
        // Fixes duplicate libraries build issue, when your project
        // uses more than one plugin that depend on C++ libs.
        jniLibs {
            pickFirsts += ['lib/**/libc++_shared.so']
        }
    }
}

flutter {
    source '../..'
}


dependencies {
    implementation 'com.github.ankidroid:Anki-Android:2.17alpha14'
    implementation 'com.github.umair13adil:RxLogs:v1.0.18'
    // Bundled ML Kit Japanese text-recognition model (~4 MB on arm64). The
    // vendored google_mlkit_text_recognition plugin declares the per-script
    // recognizers compileOnly; the app must supply the one it actually uses.
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
}
